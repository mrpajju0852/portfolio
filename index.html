<!DOCTYPE html>
<html>

<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px;
            margin: 5px;
        }

        li {
            background: white;
            margin: 10px;
            padding: 10px;
            list-style: none;
        }
    </style>

</head>

<body>

    <h1>My To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value;

            if (task === "") return;

            let li = document.createElement("li");
            li.innerText = task;

            let btn = document.createElement("button");
            btn.innerText = "Delete";
            btn.onclick = function () {
                li.remove();
            };

            li.appendChild(btn);
            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }
    </script>

</body>

</html>
